    <style>html{background:#04060c}html[data-theme="light"]{background:#eef3fc}@media (prefers-color-scheme: light){html:not([data-theme="dark"]){background:#eef3fc}}html[data-look="gray"]{background:#0f1012}</style>
    <title>Blue Fit</title>
    <script>
      try { var t = JSON.parse(localStorage.getItem("bf-theme") || '"system"'); if (t !== "system") document.documentElement.dataset.theme = t; } catch (e) {}
      try { if (JSON.parse(localStorage.getItem("bf-look") || '"neon"') === "gray") { document.documentElement.dataset.look = "gray"; document.documentElement.dataset.theme = "dark"; } } catch (e) {}
      try { var a = JSON.parse(localStorage.getItem("bf-accent") || '"blue"'); if (a !== "blue") document.documentElement.dataset.accent = a; } catch (e) {}
    </script>
